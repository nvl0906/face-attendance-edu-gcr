name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: face-attendance-09063102
  LOCATION: africa-south1
  SERVICE_NAME: face-attendance-edu
  REPO_NAME: face-attendance-edu-repo

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build, push and deploy
        run: |
          gcloud builds submit . \
            --config deploy_face_attendance_edu_to_gcr.yaml \
            --region "$LOCATION" \
            --project "$PROJECT_ID" \
            --substitutions=_REPO_NAME=$REPO_NAME,_SERVICE_NAME=$SERVICE_NAME,_IMAGE_TAG=${GITHUB_SHA::7}
